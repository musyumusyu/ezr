<style>
:root{--bg:#f3f4f8;--fg:#14161f;--pn:#fff;--ln:#c4c8d8;--ac:#d9267d;--cr:#c58a00;--dm:#d33;--mut:#6b7188;--wv:rgba(70,90,200,.22);--sl:#1f8bd6;--gd:#2eaa5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1018;--fg:#f1f2f7;--pn:#171a26;--ln:#3a4060;--ac:#ff5fa8;--cr:#ffd24a;--dm:#ff5c5c;--mut:#9097b3;--wv:rgba(140,170,255,.26);--sl:#4cc3ff;--gd:#5be08a}}
:root[data-theme="dark"]{--bg:#0e1018;--fg:#f1f2f7;--pn:#171a26;--ln:#3a4060;--ac:#ff5fa8;--cr:#ffd24a;--dm:#ff5c5c;--mut:#9097b3;--wv:rgba(140,170,255,.26);--sl:#4cc3ff;--gd:#5be08a}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px system-ui,-apple-system,"Hiragino Sans",sans-serif}
#app{display:flex;height:100%}
#brand{display:flex;align-items:center;gap:10px;padding:2px 2px 10px;margin-bottom:6px;border-bottom:1px solid var(--ln)}
#brand img{width:36px;height:36px;border-radius:8px;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#brand span{font-weight:700;font-size:16px;letter-spacing:.02em;color:var(--fg)}
#side{width:340px;flex:none;overflow:auto;background:var(--pn);border-right:1px solid var(--ln);padding:8px;box-sizing:border-box}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#ctx{position:absolute;z-index:6;width:310px;max-height:72%;overflow:auto;background:var(--pn);border:1px solid var(--ln);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);padding:8px;display:none}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;background:var(--pn);border-bottom:1px solid var(--ln)}
#tools,#tools2{display:flex;gap:3px;flex-wrap:wrap}.brk{flex-basis:100%;width:100%;height:0}
canvas{flex:1;min-height:0;width:100%;display:block;cursor:crosshair;touch-action:none}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:3px 6px}
button{cursor:pointer}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
.r{display:flex;gap:4px;align-items:center;margin:3px 0;flex-wrap:wrap}
.m{color:var(--mut);font-size:12px;line-height:1.6}
#st{display:inline-block;width:215px;white-space:nowrap;overflow:hidden;vertical-align:bottom;font-variant-numeric:tabular-nums}#msg{display:inline-block;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}#tools button,#tools2 button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 4px;min-width:62px;font-size:11px;line-height:1.15}#tools canvas,#tools2 canvas{flex:none;width:56px;height:40px;min-height:0;cursor:pointer}
#pvPanel{position:absolute;right:6px;z-index:5;display:none;flex-direction:column;align-items:flex-end;gap:4px}#pvCtl,#pvBody{background:var(--pn);border:1px solid var(--ln);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);padding:6px;box-sizing:border-box}#pvCtl{width:224px}#pvTab{position:absolute;right:0;z-index:5;display:none;border-radius:8px 0 0 8px}
#evb{gap:6px;align-items:center}.sw{width:16px;height:16px;padding:0;border-radius:4px}input[type=color]{width:34px;height:24px;padding:1px}
#st{color:var(--mut);margin-left:auto}#msg{color:var(--ac)}
</style></head><body>

<script>
const $=id=>document.getElementById(id),KEY='chart-editor-v1',R6=x=>Math.round(x*1e8)/1e8;
const newChart=()=>({title:'',lanes:4,offset:0,tempo:[{beat:0,bpm:120}],meter:[{beat:0,num:4,den:4}],scroll:[],layers:{},notes:[]});
function long2slide(n){
  if(n.type!=='long')return n;
  const p0={beat:n.beat,lane:n.lane},p1={beat:R6(n.beat+n.len),lane:n.lane};
  if(n.width>1){p0.width=n.width;p1.width=n.width}
  const o=Object.assign({},n,{type:'slide',points:[p0,p1],tail:n.tail??'none'});
  delete o.beat;delete o.lane;delete o.width;delete o.len;return o;
}
function relayConv(n){ // 点と同じ拍の relays は点の relay フラグに変換(書き出し時に relays へ戻す)
  if((n.type!=='slide'&&n.type!=='guide')||!Array.isArray(n.points)||!Array.isArray(n.relays))return n;
  const keep=[];
  n.relays.forEach(r=>{const p=n.points.find((q,i)=>i>0&&i<n.points.length-1&&Math.abs(q.beat-r)<1e-7);if(p)p.relay=true;else keep.push(r)});
  if(keep.length)n.relays=keep;else delete n.relays;return n}
function fix(o){const c=Object.assign(newChart(),o);if(!o.tempo)c.tempo=[{beat:0,bpm:o.bpm>0?o.bpm:120}];if(!c.meter)c.meter=[{beat:0,num:4,den:4}];c.scroll=c.scroll||[];c.layers=c.layers||{};c.notes=(Array.isArray(c.notes)?c.notes:[]).map(long2slide).map(relayConv);c.offset=+c.offset||0;delete c.bpm;return c}
let C=newChart(),hist=[],fut=[],sel=null,tool='tap',snapN=16,ppb=90,sb=-1,crit=false,wd=1,nlayer='',edLayer='',hov=null,drag=null,draft=null;
let TM=[],G={xl:84,lw:60,jy:400,w:240},CS={},W=0,H=0,env=null,envDt=.005,gmax=1,audioBuf=null,actx=null,src=null,songGain=null,playing=false,pT0=0,pSec0=0,lastB=0,mt=0;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.notes)C=fix(s)}catch(e){}
const cv=$('cv');let g=cv.getContext('2d');
let selEv=null,evs=[],NS=0,MK=[],ms=[],mq=null,evIn=null,clip=null,ps=[],ptClip=null,clipKind='';
const mk=(tag,p={},kids=[])=>{const e=document.createElement(tag);Object.assign(e,p);kids.forEach(k=>e.append(k));return e};
const lab=t=>mk('span',{textContent:t});
function msg(t){$('msg').textContent=t;clearTimeout(mt);mt=setTimeout(()=>$('msg').textContent='',4000)}

// ===== テンポ・変換 =====
function buildTM(){TM=[];let s=0;C.tempo.forEach((q,i)=>{if(i){const p=C.tempo[i-1];s+=(q.beat-p.beat)*60/p.bpm}TM.push({beat:q.beat,bpm:q.bpm,sec:s})})}
const b2s=b=>{let i=TM.length-1;while(i>0&&TM[i].beat>b)i--;return TM[i].sec+(b-TM[i].beat)*60/TM[i].bpm};
const s2b=t=>{let i=TM.length-1;while(i>0&&TM[i].sec>t)i--;return TM[i].beat+(t-TM[i].sec)*TM[i].bpm/60};
const isPts=n=>n.type==='slide'||n.type==='guide';
const hdef=n=>n.head??(n.type==='guide'?'none':'tap'),tdef=n=>n.tail??(n.type==='slide'?'hold':'none');
const snapB=b=>R6(Math.round(b*snapN/4)*4/snapN),nbeat=n=>isPts(n)?n.points[0].beat:n.beat;
const ease=(c,u)=>c==='in'?u*u:c==='out'?1-(1-u)*(1-u):c==='smooth'?u*u*(3-2*u):u; // in=加速 out=減速
const bandPts=n=>n.type==='long'?[{beat:n.beat,lane:n.lane,w:n.width||1},{beat:n.beat+n.len,lane:n.lane,w:n.width||1}]:isPts(n)?n.points.map(p=>({beat:p.beat,lane:p.lane,w:p.width||1,curve:p.curve||n.curve,col:p.color})):[{beat:n.beat,lane:n.lane,w:n.width||1}];

// ===== 編集履歴 =====
function afterEdit(){buildTM();try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}panels();draw()}
function mod(fn){hist.push(JSON.stringify(C));if(hist.length>80)hist.shift();fut=[];fn();afterEdit()}
function undo(){if(!hist.length)return;fut.push(JSON.stringify(C));C=fix(JSON.parse(hist.pop()));ps=[];sel=null;ms=[];selEv=null;evs=[];draft=null;afterEdit()}
function redo(){if(!fut.length)return;hist.push(JSON.stringify(C));C=fix(JSON.parse(fut.pop()));ps=[];sel=null;ms=[];selEv=null;evs=[];draft=null;afterEdit()}
function delPoints(){
  const by=new Map();ps.forEach(z=>{if(!by.has(z.n))by.set(z.n,[]);by.get(z.n).push(z.p)});
  let blocked=0;
  mod(()=>{by.forEach((arr,n)=>{if(n.points.length-arr.length<2){blocked++;return}n.points=n.points.filter(p=>!arr.includes(p))});ps=[];sel=null;ms=[]});
  if(blocked)msg('点が2つ未満になるスライドは点を消せません(ノーツごと削除してください)');
}
function delMixed(){ // ノーツと点を一緒に削除(取り消し1回)。点が2つ未満になるスライドの点は消さない
  const W=wholeNotes(),by=new Map();ps.forEach(z=>{if(!by.has(z.n))by.set(z.n,[]);by.get(z.n).push(z.p)});let blocked=0;
  mod(()=>{C.notes=C.notes.filter(n=>!W.includes(n));by.forEach((arr,n)=>{if(n.points.length-arr.length<2){blocked++;return}n.points=n.points.filter(p=>!arr.includes(p))});ps=[];sel=null;ms=[]});
  if(blocked)msg('点が2つ未満になるスライドの点は消していません');
}
function delSel(){if(isMixed()){delMixed();closeCtx();return}if(ps.length){delPoints();closeCtx();return}const L=ms.length?ms.slice():sel?[sel]:[],EV=evs.filter(e=>!fixedEv(e));
  if(!L.length&&!EV.length){if(evs.length)msg('先頭(0拍)は削除できません');return}
  const skipped=evs.length-EV.length;
  mod(()=>{L.forEach(n=>{const i=C.notes.indexOf(n);if(i>=0)C.notes.splice(i,1);if(draft===n)draft=null});EV.forEach(e=>{const i=e.arr.indexOf(e.obj);if(i>=0)e.arr.splice(i,1)});sel=null;ms=[];evs=[];selEv=null});
  closeCtx();if(skipped)msg('先頭(0拍)のBPM/拍子は削除できません')}
function shift(n,db,dl,dry){
  const pts=isPts(n)?n.points:[n];
  const mb=Math.min(...pts.map(p=>p.beat)),ml=Math.min(...pts.map(p=>p.lane)),mx=Math.max(...pts.map(p=>p.lane+(p.width||1)));
  if(mb+db<-1e-9||ml+dl<0||mx+dl>C.lanes)return false;
  if(!dry){pts.forEach(p=>{p.beat=R6(p.beat+db);p.lane+=dl});if(n.relays)n.relays=n.relays.map(v=>R6(v+db))}return true;
}

// ===== 曲 =====
function makeEnv(buf){
  const d=buf.getChannelData(0),d2=buf.numberOfChannels>1?buf.getChannelData(1):null,step=Math.floor(envDt*buf.sampleRate),n=Math.ceil(buf.duration/envDt);
  env=new Float32Array(n);gmax=1e-6;
  for(let i=0;i<n;i++){let m=0;const a=i*step,b=Math.min(d.length,a+step);for(let j=a;j<b;j++){const v=d2?Math.max(Math.abs(d[j]),Math.abs(d2[j])):Math.abs(d[j]);if(v>m)m=v}env[i]=m;if(m>gmax)gmax=m}
}
$('fA').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const ab=await f.arrayBuffer();idbPut('song',{name:f.name,data:ab.slice(0)});audioBuf=await actx.decodeAudioData(ab);makeEnv(audioBuf);msg('曲: '+f.name);draw()}
  catch(x){msg('曲の読み込みに失敗しちゃった…')}e.target.value=''};
// ===== ヒット音(ノーツ種別) =====
const SEKEY='chart-editor-se-v1',SEK=[['tap','タップ'],['flick','フリック'],['trace','トレース'],['damage','ダメージ'],['slide','スライド'],['guide','ガイド'],['relay','中継点'],['tail','終点']];
const SEWV=[['sine','サイン波'],['square','矩形波'],['triangle','三角波'],['sawtooth','ノコギリ波'],['noise','ノイズ']];
const seDef=()=>Object.fromEntries(SEK.map(([k])=>[k,{on:true,wave:'sine',f:1100,cf:1900,vol:.12}]));
let SE=seDef(),SEB={},seTarget='',noiseBuf=null;
try{const o=JSON.parse(localStorage.getItem(SEKEY));if(o)for(const k in SE)if(o[k])Object.assign(SE[k],o[k])}catch(e){}
const seSave=()=>{try{localStorage.setItem(SEKEY,JSON.stringify(SE))}catch(e){}};
function seKey(n){if(!isPts(n))return n.type;const h=hdef(n);return['tap','flick','trace','damage'].includes(h)?h:n.type}
function tailKey(n){const t=tdef(n);return['tap','flick','trace','damage'].includes(t)?t:'tail'}
function playSE(k,crit){
  const s=SE[k];if(!s||!s.on)return;
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
  const t=actx.currentTime,f=crit?s.cf:s.f,B=(crit&&SEB[k+':c'])||SEB[k],a=actx.createGain();a.connect(actx.destination);
  if(B){ // 音声ファイル: 音量は振幅の5倍(既定.12→.6)。CRITは再生速度で高く
    const o=actx.createBufferSource();o.buffer=B.buf;o.playbackRate.value=crit&&B===SEB[k]&&s.f>0?s.cf/s.f:1;a.gain.value=Math.min(4,s.vol*5);o.connect(a);o.start(t);return}
  a.gain.setValueAtTime(Math.max(.0001,s.vol),t);a.gain.exponentialRampToValueAtTime(.001,t+.05);
  if(s.wave==='noise'){
    if(!noiseBuf){noiseBuf=actx.createBuffer(1,Math.floor(actx.sampleRate*.08),actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const o=actx.createBufferSource(),bp=actx.createBiquadFilter();o.buffer=noiseBuf;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1.2;
    a.gain.cancelScheduledValues(t);a.gain.setValueAtTime(Math.max(.0001,s.vol*3),t);a.gain.exponentialRampToValueAtTime(.001,t+.05);
    o.connect(bp);bp.connect(a);o.start(t);o.stop(t+.06);return}
  const o=actx.createOscillator();o.type=s.wave;o.frequency.value=f;o.connect(a);o.start(t);o.stop(t+.06);
}
function seUI(){
  const box=$('seL');box.replaceChildren();
  SEK.forEach(([k,l])=>{
    const s=SE[k],wrap=mk('div');wrap.style.cssText='border-top:1px solid var(--ln);padding:3px 0';
    const r=(...x)=>{const d=mk('div',{className:'r'});x.forEach(e=>d.append(e));wrap.append(d)};
    const on=mk('input',{type:'checkbox',checked:s.on,onchange:()=>{s.on=on.checked;seSave()}});
    const nin=(key,w,step,min,max)=>{const i=mk('input',{type:'number',value:s[key],step,min,max});i.style.width=w;i.onchange=()=>{const v=parseFloat(i.value);if(!isNaN(v)&&v>=min&&v<=max){s[key]=v;seSave()}else i.value=s[key]};return i};
    const wv=mk('select');SEWV.forEach(([v,t])=>wv.append(mk('option',{value:v,textContent:t})));wv.value=s.wave;wv.onchange=()=>{s.wave=wv.value;seSave()};
    r(on,mk('b',{textContent:l}),mk('button',{textContent:'▶',onclick:()=>playSE(k,false)}),mk('button',{textContent:'C▶',onclick:()=>playSE(k,true)}));
    r(wv,lab('Hz'),nin('f','60px',1,20,20000),lab('CRIT'),nin('cf','60px',1,20,20000),lab('音量'),nin('vol','50px',.01,0,1));
    const fileRow=(lb,key)=>{const B=SEB[key],fr=[lab(lb),mk('button',{textContent:B?(B.name.length>12?B.name.slice(0,11)+'…':B.name):'音声ファイル…',onclick:()=>{seTarget=key;$('fSE').click()}})];if(B)fr.push(mk('button',{textContent:'解除',onclick:()=>{delete SEB[key];idbDel('se:'+key);seUI()}}));r(...fr)};
    fileRow('通常',k);fileRow('CRIT',k+':c');box.append(wrap);
  });
  box.append(mk('button',{textContent:'すべて初期設定に戻す',onclick:()=>{Object.keys(SEB).forEach(k=>idbDel('se:'+k));SE=seDef();SEB={};seSave();seUI()}}));
}
$('fSE').onchange=async e=>{const f=e.target.files[0];if(!f||!seTarget){e.target.value='';return}
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const ab=await f.arrayBuffer();idbPut('se:'+seTarget,{name:f.name,data:ab.slice(0)});const buf=await actx.decodeAudioData(ab);SEB[seTarget]={buf,name:f.name};seUI();msg('SE: '+f.name)}
  catch(x){msg('音声を読み込めません')}e.target.value=''};
// ===== ノーツ数カウント =====
const CNT={from:null,to:null,tick:.5,relay:true,damage:false,rel:false,show:false},CJ=['tap','flick','trace','damage'];
try{const o=JSON.parse(localStorage.getItem('chart-editor-cnt'));if(o){if([0,.25,.5,1].includes(o.tick))CNT.tick=o.tick;CNT.relay=o.relay!==false;CNT.damage=!!o.damage;CNT.rel=!!o.rel}}catch(e){}
const cntSave=()=>{try{localStorage.setItem('chart-editor-cnt',JSON.stringify({tick:CNT.tick,relay:CNT.relay,damage:CNT.damage,rel:CNT.rel}))}catch(e){}};
function judgePts(n){ // [{b:拍,k:種類,s:出どころ(s単体/h始点/t終点/r中継/i途中),c:CRIT}]
  const o=[];
  if(!isPts(n)){if(CJ.includes(n.type))o.push({b:n.beat,k:n.type,s:'s',c:!!n.crit});return o}
  const P=n.points,a=P[0],z=P[P.length-1],hk=hdef(n),tk=tdef(n);
  if(CJ.includes(hk))o.push({b:a.beat,k:hk,s:'h',c:!!(n.headCrit??n.crit)});
  if(P.length>1&&(CJ.includes(tk)||tk==='hold'))o.push({b:z.beat,k:tk==='hold'?'hold':tk,s:'t',c:!!(n.tailCrit??n.crit)});
  if(n.type==='slide'&&P.length>1){
    const rb=CNT.relay?relayBeats(n):[];
    rb.forEach(b=>o.push({b,k:'relay',s:'r',c:!!n.crit}));
    const t=CNT.tick; // 帯の途中だけ。始点・終点の拍には途中判定を置かない
    if(t>0){const k0=CNT.rel?1:Math.floor(a.beat/t+1e-9)+1;for(let k=k0;;k++){const b=R6(CNT.rel?a.beat+k*t:k*t);if(b>=z.beat-1e-9)break;if(rb.some(v=>Math.abs(v-b)<1e-7))continue;o.push({b,k:'tick',s:'i',c:!!n.crit})}}
  }
  return o;
}
function cntBounds(){let lo=CNT.from,hi=CNT.to;if(lo!=null&&hi!=null&&lo>hi)[lo,hi]=[hi,lo];return [lo==null?-Infinity:lo,hi==null?Infinity:hi]}
function countNotes(){
  const [lo,hi]=cntBounds(),r={tap:0,flick:0,trace:0,damage:0,hold:0,relay:0,tick:0,crit:0,g:{s:{},h:{},t:{}}};
  for(const n of C.notes)for(const j of judgePts(n))if(j.b>=lo-1e-9&&j.b<=hi+1e-9){
    r[j.k]++;if(j.c&&(j.k!=='damage'||CNT.damage))r.crit++;if(r.g[j.s])r.g[j.s][j.k]=(r.g[j.s][j.k]||0)+1}
  r.total=r.tap+r.flick+r.trace+r.hold+r.relay+r.tick+(CNT.damage?r.damage:0);return r;
}
let cntEl=null,cntIn=null;
function cntSet(f,t){CNT.from=f;CNT.to=t;if(cntIn){cntIn[0].value=f==null?'':f;cntIn[1].value=t==null?'':t}draw();cntUpdate()}
function cntUI(){
  const box=$('cntL');box.replaceChildren();
  const row=(...x)=>{const d=mk('div',{className:'r'});x.forEach(e=>d.append(e));box.append(d)};
  const num=(ph,key)=>{const i=mk('input',{type:'number',step:'any',min:0,placeholder:ph});i.style.width='74px';i.onchange=()=>{const v=parseFloat(i.value);CNT[key]=isNaN(v)?null:Math.max(0,v);draw();cntUpdate()};return i};
  const fi=num('先頭','from'),ti=num('末尾','to');cntIn=[fi,ti];
  row(lab('範囲'),fi,lab('～'),ti);
  row(mk('button',{textContent:'開始=再生位置',onclick:()=>cntSet(R6(sb),CNT.to)}),mk('button',{textContent:'終了=再生位置',onclick:()=>cntSet(CNT.from,R6(sb))}));
  row(mk('button',{textContent:'選択ノーツの範囲',onclick:()=>{const L=ms.length?ms:sel?[sel]:[];if(!L.length){msg('ノーツを選択してください');return}
    const bs=L.flatMap(n=>isPts(n)?n.points.map(p=>p.beat):[n.beat]);cntSet(Math.min(...bs),Math.max(...bs))}}),mk('button',{textContent:'全体',onclick:()=>cntSet(null,null)}));
  const tk=mk('select');[[.5,'8分'],[.25,'16分'],[1,'4分'],[0,'なし']].forEach(([v,t])=>tk.append(mk('option',{value:v,textContent:t,selected:CNT.tick===v})));
  tk.onchange=()=>{CNT.tick=+tk.value;cntSave();cntUpdate();draw()};
  const rl=mk('input',{type:'checkbox',checked:CNT.relay});rl.onchange=()=>{CNT.relay=rl.checked;cntSave();cntUpdate();draw()};
  const dm=mk('input',{type:'checkbox',checked:CNT.damage});dm.onchange=()=>{CNT.damage=dm.checked;cntSave();cntUpdate();draw()};
  row(lab('8分判定'),tk);row(rl,lab('中継点を数える'),dm,lab('ダメージを数える'));
  const rv=mk('input',{type:'checkbox',checked:CNT.rel});rv.onchange=()=>{CNT.rel=rv.checked;cntSave();cntUpdate();draw()};
  const sh=mk('input',{type:'checkbox',checked:CNT.show});sh.onchange=()=>{CNT.show=sh.checked;draw()};
  row(rv,lab('8分判定を始点基準にする'));row(sh,lab('判定点を譜面に表示'));
  cntEl=mk('div');box.append(cntEl);
  box.append(mk('div',{className:'m',textContent:'8分判定は始点終点と中継点と二重で判定されません'}));
}
function cntUpdate(){
  if(!cntEl)return;const r=countNotes(),[lo,hi]=cntBounds();cntEl.replaceChildren();
  const big=mk('div',{textContent:r.total+' ノーツ'});big.style.cssText='font-size:20px;font-weight:700;margin:4px 0';cntEl.append(big);
  if(lo>-Infinity||hi<Infinity)cntEl.append(mk('div',{className:'m',textContent:'範囲: '+(lo>-Infinity?R6(lo):'先頭')+' ～ '+(hi<Infinity?R6(hi):'末尾')+' 拍'}));

const NMT={tap:'タップ',flick:'フリック',trace:'トレース',damage:'ダメージ',hold:'デフォルト',none:'なし'};

// ===== スライド造形: 選んだ点→次の点の間に、ギザギザ/カーブ/逆カーブを作る =====
function shapeSeg(n,p,kind){
  const a=n.points,i=a.indexOf(p),q=a[i+1];if(i<0||!q)return;
  const b0=p.beat,b1=q.beat,w=p.width||1,mx=C.lanes-w,cl=v=>Math.max(0,Math.min(mx,v));
  if(kind==='zig'){ // 今の分割数ごとに、今のレーンと もう1つのレーンを行き来(最後の点は次の点に重ならない手前まで)
    const step=4/snapN,L1=cl(p.lane);let L2;
    if(q.lane!==p.lane)L2=cl(q.lane);                       // 始点と次の点のレーンが違う → その2つのレーンの間でギザギザ
    else L2=p.lane+1<=mx?p.lane+1:p.lane-1;                 // 同じ → 1つ隣のレーン(右が空いていれば右、だめなら左)
    if(L2<0||L2===L1){msg('ギザギザにできるレーンがありません');return}
    const add=[];let k=Math.floor(b0/step+1e-9)+1;
    for(;R6(k*step)<b1-1e-9;k++){
      if(add.length>=600){msg('分割が細かすぎて点が多すぎます(最大600点)。分割数を下げてください');return}
      const pt={beat:R6(k*step),lane:add.length%2===0?L2:L1,curve:'linear'};if(w>1)pt.width=w;add.push(pt)}
    if(!add.length){msg('点を置ける隙間がありません(分割数を上げてください)');return}
    mod(()=>{p.curve='linear';a.splice(i+1,0,...add)});msg('ギザギザ: '+add.length+'点を追加しました');return;
  }
  // カーブ=真ん中まで減速→そこから加速 / 逆カーブ=真ん中まで加速→そこから減速。真ん中は13440分割の格子で「ほぼ中央」
  if(p.lane===q.lane){msg('次の点とレーンが同じなので、カーブになりません');return}
  const mb=R6(Math.round((b0+b1)/2*3360)/3360);
  if(!(mb>b0+1e-9&&mb<b1-1e-9)){msg('点の間が短すぎます');return}
  const m={beat:mb,lane:R6((p.lane+q.lane)/2)};if(w>1)m.width=w;
  const c1=kind==='curve'?'out':'in',c2=kind==='curve'?'in':'out';
  mod(()=>{p.curve=c1;m.curve=c2;a.splice(i+1,0,m)});
  msg((kind==='curve'?'カーブ':'逆カーブ')+'にしました(中央の点: 拍'+mb+' レーン'+m.lane+')');
}

  row(lab('幅を一括変更'),wi);
  row(lab('色'),...colUI(()=>undefined,v=>L.forEach(z=>{if(v)z.p.color=v;else delete z.p.color})));
  row(lab('レーン移動'),mk('button',{textContent:'◀',onclick:()=>shiftPts(-1)}),mk('button',{textContent:'▶',onclick:()=>shiftPts(1)}));
  row(cpy,del);row(bk);
}

function problems(){
  const P=[],L=C.lanes,asc=(a,nm)=>a.forEach((q,i)=>{if(i&&q.beat<=a[i-1].beat)P.push(nm+'の拍が重複/逆順')});
  asc(C.tempo,'BPM');asc(C.meter,'拍子');asc(C.scroll,'ソフラン');for(const k in C.layers)asc(C.layers[k],'レイヤー'+k);
  C.meter.forEach(m=>{if(![1,2,4,8,16].includes(m.den)||!(m.num>=1))P.push('拍子が不正')});
  let oor=0,bad=0;
  C.notes.forEach(n=>{
    if(bandPts(n).some(p=>p.lane<0||p.lane+p.w>L))oor++;
    if((isPts(n)&&n.points.length<2)||(n.layer!==undefined&&!(n.layer in C.layers)))bad++;
  });
  if(oor)P.push('範囲外のノーツ '+oor+' 個');if(bad)P.push('不完全なノーツ '+bad+' 個');
  return P;
}
function exNote(n){ // 点のrelay印は書き出し時に relays(拍の配列)へ戻す
  if(!isPts(n))return n;
  const P=n.points,fl=[];P.forEach((p,i)=>{if(p.relay&&i>0&&i<P.length-1)fl.push(p.beat)});
  const o=Object.assign({},n);o.points=P.map(p=>{const q=Object.assign({},p);delete q.relay;return q});
  const rs=[...new Set([...(n.relays||[]),...fl].map(R6))].sort((a,b)=>a-b);
  if(rs.length)o.relays=rs;else delete o.relays;return o;
}
function toJSON(){
  const o={};if(C.title)o.title=C.title;o.lanes=C.lanes;o.offset=C.offset;o.tempo=C.tempo;o.meter=C.meter;
  if(C.scroll.length)o.scroll=C.scroll;if(Object.keys(C.layers).length)o.layers=C.layers;
  const notes=[...C.notes].sort((a,b)=>nbeat(a)-nbeat(b));
  return '{\n'+Object.entries(o).map(([k,v])=>' "'+k+'":'+JSON.stringify(v)).join(',\n')+',\n "notes":[\n'+notes.map(n=>'  '+JSON.stringify(exNote(n))).join(',\n')+'\n ]\n}';
}

const SNAPS=[4,6,8,12,16,24,32,48,64,96,192,384,768,960,13440];
function syncSnap(){$('snap').value=snapN;$('snapSel').value=SNAPS.includes(snapN)?snapN:''}

// ===== 全画面表示 =====
{const de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen,
  ex=document.exitFullscreen||document.webkitExitFullscreen,isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
 $('bFs').onclick=()=>{
  if(!rq){msg('このブラウザは全画面表示に対応していません');return}
  try{const r=isFs()?ex.call(document):rq.call(de);if(r&&r.catch)r.catch(()=>msg('全画面表示にできませんでした'))}catch(e){msg('全画面表示にできませんでした')}};
 const sync=()=>{$('bFs').textContent=isFs()?'全画面解除':'全画面';try{fit();draw()}catch(e){}};
 document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync)}
let nt=0;$('bNew').onclick=()=>{
  if(Date.now()-nt>3000){nt=Date.now();msg('もう一度「新規」で全消去');return}
  nt=0;mod(()=>{C=newChart();ps=[];sel=null;ms=[];draft=null});sb=-1;
};

$('fJ').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const o=JSON.parse(await f.text());mod(()=>{C=fix(o);ps=[];sel=null;ms=[];draft=null});sb=-1;msg('譜面を読み込みました')}catch(x){msg('読み込めません: '+x.message)}e.target.value=''};
$('exCopy').onclick=async()=>{try{await navigator.clipboard.writeText(toJSON());msg('コピーしました')}catch(e){$('ex').select();try{document.execCommand('copy');msg('コピーしました')}catch(x){msg('テキストを選択してコピーしてください')}}};
$('exSave').onclick=async()=>{
  const name=((C.title||'chart').replace(/[\\/:*?"<>|]/g,'_'))+'.json',data=toJSON();
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  try{if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){await d.save({filename:name,data});return}}}catch(e){} // Claudeのアーティファクト内だけで使える保存
  if(ios){ // iPhone/iPad: 共有メニューから「ファイルに保存」。だめならクリップボードへ
    try{const f=new File([data],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});msg('保存/共有しました');return}
    }catch(e){if(e&&e.name==='AbortError')return}
    if(matchMedia('(display-mode: standalone)').matches){try{await navigator.clipboard.writeText(data);msg('ファイルにできなかったので、コピーしました。メモ等に貼って保存してください');return}catch(e){}}
  }
  try{ // Android・パソコン: ふつうのダウンロード(Androidでは「ダウンロード」フォルダに入る)
    const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);msg('ダウンロードしました: '+name);
  }catch(e){msg('頑張ってみたけど保存できなかった、、コピーを使ってください')}
};
